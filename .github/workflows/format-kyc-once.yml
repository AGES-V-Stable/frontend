name: Format BlindPay KYC (temporary)
on:
  push:
    branches:
      - feat/blindpay-onboarding-complementar
    paths:
      - .github/workflows/format-kyc-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'AGES-V-Stable/frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/blindpay-onboarding-complementar
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only new KYC UI files
        run: |
          npx prettier --write \
            src/features/onboarding/api/blindpayIndividualKyc.ts \
            src/features/onboarding/pages/BlindPayComplement/BlindPayComplement.tsx \
            src/features/onboarding/pages/BlindPayComplement/BlindPayComplement.test.tsx \
            src/features/onboarding/pages/BlindPayComplement/validation.ts \
            src/features/onboarding/pages/BlindPayIndividualKyc/BlindPayIndividualKyc.tsx \
            src/features/onboarding/pages/BlindPayIndividualKyc/BlindPayIndividualKyc.test.tsx \
            src/features/onboarding/pages/KycFullPreview/KycFullPreview.tsx
          git diff --check
      - name: Commit formatting to feature branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/features/onboarding
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "style(onboarding): aplica Prettier aos novos componentes KYC"
            git push origin HEAD:feat/blindpay-onboarding-complementar
          fi
